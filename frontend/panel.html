<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101f2a" />
    <title>Espacio de trabajo · Empresa Valuadora</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/estilos.css" />
    <script src="/js/iconos.js" defer></script>
    <script src="/js/nucleo.js" defer></script>
    <script src="/js/vistas-base.js" defer></script>
    <script src="/js/vista-nueva.js" defer></script>
    <script src="/js/vista-detalle.js" defer></script>
    <script src="/js/vista-cotizacion.js" defer></script>
    <script src="/js/vista-referencia.js" defer></script>
    <script src="/js/vista-inicio.js" defer></script>
    <script src="/js/graficas.js" defer></script>
    <script src="/js/vista-reportes.js" defer></script>
    <script src="/js/vista-usuarios.js" defer></script>
    <script src="/js/vista-auditoria.js" defer></script>
  </head>
  <body data-pagina="panel">
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <div class="app-layout">
      <aside
        id="lateral"
        class="lateral"
        aria-label="Navegación del espacio de trabajo"
      >
        <a class="marca-cab" href="/"
          ><span class="monograma" aria-hidden="true">V<span></span></span
          ><span class="nombre-marca"
            >Empresa Valuadora<small>Espacio de trabajo</small></span
          ></a
        >
        <p class="menu-rotulo">Gestión patrimonial</p>
        <nav id="menu" class="nav flex-column" aria-label="Secciones"></nav>
        <div class="lateral-firma" aria-hidden="true">
          <span>V.</span>
          <p>Perspectiva.<br />Precisión.<br />Valor.</p>
        </div>
        <div class="pie mt-auto">
          <div class="perfil-linea">
            <span id="avatar-usuario" class="avatar-usuario" aria-hidden="true"
              >EV</span
            >
            <div class="perfil-datos">
              <div id="usuario" class="small fw-semibold text-truncate"></div>
              <div id="rol-etiqueta" class="small text-muted"></div>
            </div>
          </div>
          <button
            id="salir"
            class="btn btn-outline-secondary btn-sm w-100"
            type="button"
          >
            Cerrar sesión ↗
          </button>
        </div>
      </aside>
      <button
        id="velo-menu"
        class="velo-menu"
        type="button"
        aria-label="Cerrar menú"
        hidden
      ></button>
      <div class="principal">
        <header class="barra-espacio">
          <div class="ruta-espacio">
            <button
              id="abrir-menu"
              class="btn btn-outline-secondary btn-sm"
              type="button"
              aria-expanded="false"
              aria-controls="lateral"
            >
              Menú</button
            ><span class="ruta-raiz">Espacio de trabajo</span
            ><span class="ruta-separador" aria-hidden="true">/</span
            ><span id="vista-actual">Inicio</span>
          </div>
          <span id="fecha-espacio" class="fecha-espacio"></span>
        </header>
        <main id="contenido" class="container-fluid" tabindex="-1"></main>
        <footer class="pie-espacio">
          <span>Empresa Valuadora · Inmuebles, Industrias y Maquinaria</span
          ><span>Prototipo académico · Datos ficticios</span>
        </footer>
      </div>
    </div>
  </body>
</html>
